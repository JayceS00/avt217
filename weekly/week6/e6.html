<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>e6: CSS box and position</title>
<link rel="stylesheet" href="css/e6.css">
<style>
</style>
</head>

<body>
  <div class="container">
    <img src="img/1975.png">
    <div class="box1">
    <h3>Box 1: This is the div box using absolute position</h3>
  </div>

    <div class="box2">
    <h4>Box 2: This is the div box using fixed position</h4>
    <div class="insidebox2">
      <ul>
        <li>It is inside Box 2 as nav</li>
      </ul>
    </div>
</div>

<div class="center">Centered</div>
<div class="sticky"><h3>Box 3: This is the div box using sticky position</h3></div>


<div class="box4">
<h3>Box 4: This is the div box using relative position</h3>
<div class = "insidebox4">
			<p>It is inside Box 4 as <b>float</b></p>
			</div>
</div>

  </div>




</body>
</html>
