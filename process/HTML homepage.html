<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The 1975 | Homepage Structure</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    div {
      border: 1px dashed #555;
      padding: 10px;
      margin: 5px;
    }

    .home-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      width: 90%;
      align-items: center;
    }

    .nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      padding: 0;
      margin: 0;
    }

    .nav li {
      border: 1px dotted gray;
      padding: 5px 10px;
    }

    .main-content {
      text-align: center;
      width: 80%;
    }

    .album-title span {
      font-size: 2rem;
      font-weight: bold;
    }

    .album-subtitle span {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .listen-button {
      margin-top: 20px;
      border: 1px solid white;
      border-radius: 6px;
      display: inline-block;
      padding: 10px 20px;
    }

    .footer span {
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .nav ul {
        display: none;
      }
      .nav span.menu {
        display: inline-block;
        border: 1px dotted gray;
        padding: 5px;
      }
      .main-content {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="home-container">

    <div class="nav">
      <span class="menu">☰ menu</span>
      <ul>
        <li><span>Home</span></li>
        <li><span>About</span></li>
        <li><span>Music</span></li>
        <li><span>Tour</span></li>
        <li><span>Shop</span></li>
      </ul>
      <div class="nav-logo">
        <span>The 1975</span>
      </div>
    </div>

    <div class="main-content">
      <div class="album-title"><span>THE 1975</span></div>
      <div class="album-art"><!-- album cover here --></div>
      <div class="album-subtitle"><span>A BRIEF INQUIRY INTO ONLINE RELATIONSHIPS</span></div>
      <div class="listen-button"><span>listen now</span></div>
    </div>

    <div class="footer">
      <span>© 2025 The 1975</span>
    </div>

  </div>

</body>
</html>
