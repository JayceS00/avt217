<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style Board</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 24px; background:#f6f7f8; color:#111; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 32px; margin-bottom: 12px; }
    .artboard { border: 1px solid #ddd; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    img { width: 100%; height: auto; display:block; }
    .note { margin-top:10px; color:#555; font-size:14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Style Board</h1>
    <p class="note">Artboard size: 1440 × 1024 — exported PNG below </p>
    <div class="artboard">
      <img src="img/style-board.png" alt="Style board (1440x1024)" />
    </div>
  </div>
</body>
</html>
